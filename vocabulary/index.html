<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Developer Vocabulary Lab</title>
  <link rel="stylesheet" href="../styles.css">
  <link rel="stylesheet" href="/Vocabulary-Expander/vocabulary-toolkit.css">
  <style>
    body { min-height: 100vh; }
    main { width: min(1050px, calc(100% - 2rem)); margin: 0 auto; padding: 1rem 0 3rem; }
    .hero { padding: 1.2rem 0; }
    .hero h1 { margin: 0; font-size: clamp(2rem, 7vw, 3.5rem); }
    .hero p { max-width: 780px; color: var(--muted); line-height: 1.6; }
    .dependency-warning { border: 1px solid var(--danger, #ef4444); border-radius: 12px; padding: 1rem; }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <h1>Developer Vocabulary Lab</h1>
      <p>Measure general receptive vocabulary and software-engineering terminology separately. Paste a job description or technical article to collect unfamiliar terms into the profile shared with Developer Interview Prep, FieldKit, and Vocabulary Expander.</p>
    </header>
    <div id="vocabularyToolkit"></div>
  </main>

  <script src="/Vocabulary-Expander/vocabulary-toolkit.js"></script>
  <script>
    const root = document.getElementById('vocabularyToolkit');
    if (window.VocabularyToolkit) {
      window.VocabularyToolkit.mount(root, {
        defaultBank: 'developer',
        showReader: true,
        sourceLabel: 'Developer-Interview-Prep',
        homeHref: '../index.html',
        fullAppHref: '/Vocabulary-Expander/',
        sampleText: 'Design and implement an idempotent API with observable behavior, bounded latency, resilient dependency handling, normalized storage, deterministic tests, and a deployment pipeline with safe rollback.'
      });
    } else {
      root.innerHTML = '<div class="dependency-warning"><strong>Vocabulary module unavailable.</strong><p>Open this page once while online after Vocabulary-Expander is deployed. The interview-prep service worker will cache the shared module for later sessions.</p><p><a href="/Vocabulary-Expander/">Open Vocabulary Expander</a></p></div>';
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('../service-worker.js').catch(() => {});
  </script>
</body>
</html>
